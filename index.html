<!DOCTYPE html>
<!-- Coast Sprint live build — if you still see the old "Placeholder page" text, GitHub has not received this file yet; re-upload or push index.html -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Coast Sprint — Arcade race</title>
    <style>
      :root {
        color-scheme: dark;
        --ui: #e8eef7;
        --panel: rgba(12, 15, 20, 0.92);
        --accent: #5ee8a8;
        --warn: #ffb44d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #06080c;
        color: var(--ui);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      #game {
        flex: 1;
        width: 100%;
        display: block;
        background: #0a0d12;
      }
      .menu {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: radial-gradient(ellipse 80% 60% at 50% 40%, #152030 0%, #06080c 70%);
        z-index: 2;
        gap: 0.75rem;
      }
      .menu h1 {
        margin: 0;
        font-size: clamp(1.4rem, 5vw, 2.1rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .menu .tag {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        opacity: 0.78;
        text-align: center;
        max-width: 22rem;
        line-height: 1.45;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        max-width: 28rem;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: var(--panel);
        color: var(--ui);
        padding: 0.55rem 0.9rem;
        border-radius: 10px;
        min-height: 44px;
        transition: background 0.15s, border-color 0.15s;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      button.primary {
        background: linear-gradient(145deg, #1a3d32, #0f2620);
        border-color: rgba(94, 232, 168, 0.45);
        color: #eafff5;
      }
      .levels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 0.5rem;
        width: min(100%, 420px);
      }
      .levels button {
        text-align: left;
        font-size: 0.88rem;
      }
      .hint {
        margin-top: 0.25rem;
        font-size: 0.78rem;
        opacity: 0.55;
        text-align: center;
        max-width: 24rem;
        line-height: 1.4;
      }
      .hud {
        position: absolute;
        left: 8px;
        top: max(8px, env(safe-area-inset-top));
        font-size: 12px;
        line-height: 1.35;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
        z-index: 1;
        pointer-events: none;
        opacity: 0.92;
      }
      #touchHud {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #touchSteerPad {
        position: absolute;
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        height: clamp(100px, 24vh, 160px);
        pointer-events: auto;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(180deg, rgba(30, 38, 52, 0.45) 0%, rgba(12, 16, 24, 0.75) 100%);
        touch-action: none;
      }
      #touchGas {
        position: absolute;
        right: max(10px, env(safe-area-inset-right));
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + clamp(100px, 24vh, 160px) + 8px);
        width: min(120px, 28vw);
        height: clamp(56px, 12vh, 88px);
        pointer-events: auto;
        border-radius: 14px;
        border: 1px solid rgba(94, 232, 168, 0.35);
        background: linear-gradient(180deg, rgba(40, 90, 72, 0.5), rgba(15, 40, 32, 0.85));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: rgba(200, 255, 228, 0.85);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="game"></canvas>
      <div id="touchHud" class="hidden" aria-hidden="true">
        <div id="touchSteerPad" title="Slide finger to steer"></div>
        <div id="touchGas"><span>GAS</span></div>
      </div>
      <div id="hud" class="hud hidden"></div>
      <div id="menu" class="menu"></div>
    </div>

    <script>
      (function () {
        const TAU = Math.PI * 2;

        /** @typedef {{ ox:number, oy:number, ix:number, iy:number }} EllipseRace */
        const TRACKS = [
          { name: "Sunrise Oval", ellipse: { ox: 0, oy: 0, ix: 0, iy: 0 }, radOut: [520, 240], radIn: [380, 160], laps: 2 },
          { name: "Harbor Curve", ellipse: { ox: -40, oy: 30, ix: -20, iy: -10 }, radOut: [480, 300], radIn: [340, 200], laps: 2 },
          { name: "Cliff Chicane", ellipse: { ox: 70, oy: -50, ix: -40, iy: 20 }, radOut: [460, 220], radIn: [300, 120], laps: 3 },
          { name: "Neon Speedway", ellipse: { ox: 0, oy: 0, ix: 0, iy: 0 }, radOut: [580, 200], radIn: [430, 120], laps: 2 },
          { name: "Tight Spiral", ellipse: { ox: -60, oy: -40, ix: 35, iy: -15 }, radOut: [400, 400], radIn: [280, 280], laps: 2 },
          { name: "Master GP", ellipse: { ox: 0, oy: -80, ix: -25, iy: 40 }, radOut: [640, 280], radIn: [480, 180], laps: 3 },
        ];

        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d", { alpha: false });
        const menuEl = document.getElementById("menu");
        const hudEl = document.getElementById("hud");
        const touchHud = document.getElementById("touchHud");

        /** @typedef {{ steer: number, accel: boolean, brake: boolean }} */
        /** @typedef {{ keys: Partial<Record<string,boolean>>, touchSteer:number }} Inputs */
        const inputs = [];
        /** @type {{players:number,laps:number,ai:number,trackIndex:number}} */
        let config = { players: 1, laps: 2, ai: 3, trackIndex: 0 };

        function ellipsePoint(cx, cy, rx, ry, t) {
          return [cx + Math.cos(t) * rx, cy + Math.sin(t) * ry];
        }

        function pointNearEllipse(px, py, cx, cy, rx, ry) {
          if (rx < 1e-6 || ry < 1e-6) return { t: 0, x: cx, y: cy, nx: 0, ny: 1 };
          const ux = px - cx;
          const uy = py - cy;
          const t = Math.atan2(uy / ry, ux / rx);
          const sx = cx + Math.cos(t) * rx;
          const sy = cy + Math.sin(t) * ry;
          let nx = (px - sx) / (rx * 0.25 + Math.hypot(ux - Math.cos(t) * rx, uy - Math.sin(t) * ry));
          let ny = (py - sy) / (ry * 0.25 + Math.hypot(ux - Math.cos(t) * rx, uy - Math.sin(t) * ry));
          const nh = Math.hypot(px - sx, py - sy) + 1e-8;
          nx = (px - sx) / nh;
          ny = (py - sy) / nh;
          return { t, x: sx, y: sy, nx, ny };
        }

        /** @typedef {{ ox:number[], oy:number[], ix:number[], iy:number[] }} TrackGeom */
        function geomFromTrack(ti) {
          const tr = TRACKS[ti];
          return {
            cxo: tr.ellipse.ox,
            cyo: tr.ellipse.oy,
            rxo: tr.radOut[0],
            ryo: tr.radOut[1],
            cxi: tr.ellipse.ix,
            cyi: tr.ellipse.iy,
            rxi: tr.radIn[0],
            ryi: tr.radIn[1],
            tcx: (tr.ellipse.ox + tr.ellipse.ix) * 0.5,
            tcy: (tr.ellipse.oy + tr.ellipse.iy) * 0.5,
          };
        }

        function inRoad(g, x, y) {
          const xo = (x - g.cxo) / g.rxo;
          const yo = (y - g.cyo) / g.ryo;
          const xin = (x - g.cxi) / g.rxi;
          const yin = (y - g.cyi) / g.ryi;
          const out = xo * xo + yo * yo <= 1;
          const inn = xin * xin + yin * yin >= 1;
          return out && inn;
        }

        function snapToRoad(g, x, y) {
          const po = pointNearEllipse(x, y, g.cxo, g.cyo, g.rxo, g.ryo);
          const pi = pointNearEllipse(x, y, g.cxi, g.cyi, g.rxi, g.ryi);
          const doo = Math.hypot(x - po.x, y - po.y);
          const dii = Math.hypot(x - pi.x, y - pi.y);
          if (doo < dii) {
            const px = po.x + po.nx * 3;
            const py = po.y + po.ny * 3;
            return { x: px, y: py, nx: po.nx, ny: po.ny, ang: po.t };
          }
          const px = pi.x - pi.nx * 3;
          const py = pi.y - pi.ny * 3;
          return { x: px, y: py, nx: -pi.nx, ny: -pi.ny, ang: pi.t };
        }

        function carColor(i) {
          const c = ["#5ee8a8", "#6db4ff", "#ffb44d", "#e77bff"];
          return c[i % c.length];
        }

        function makeCar(i, g, startAngle) {
          const cx = g.tcx;
          const cy = g.tcy;
          const midRx = ((g.rxo + g.rxi) * 0.5 * 0.96) + i * 3;
          const midRy = ((g.ryo + g.ryi) * 0.5 * 0.96) + i * 3;
          const px = cx + Math.cos(startAngle) * midRx;
          const py = cy + Math.sin(startAngle) * midRy;
          const tx = cx + Math.cos(startAngle + 0.06) * midRx - px;
          const ty = cy + Math.sin(startAngle + 0.06) * midRy - py;
          const ang = Math.atan2(ty, tx);
          const prog0 = ((((Math.atan2(py - cy, px - cx) + TAU / 4) % TAU) + TAU) % TAU) / TAU;
          return {
            i,
            x: px,
            y: py,
            ang,
            vx: Math.cos(ang) * 120,
            vy: Math.sin(ang) * 120,
            smoothCamX: px,
            smoothCamY: py,
            steerSmoothed: 0,
            completedLaps: 0,
            progress: prog0,
            finished: false,
            finishRank: null,
          };
        }

        /** @type {{x:number,y:number,a:number,t:number}[]} */
        let skidMarks = [];

        let cars = [];
        let geom = null;
        /** @type {number} */
        let startTime = 0;
        let finishedCount = 0;
        /** @type {number|null} */
        let countdown = null;
        /** Race clock after GO — lap line ignored until after this time */
        let lapUnlockAt = 0;
        /** @type {number} */
        let lastT = 0;
        let resultsActive = false;
        /** Pointer-driving (P1): steering from X, gas with primary button on canvas */
        const pointerDrive = { active: false, steer: 0, gas: false, useMouse: false };

        /** @param {number} i player index binding */
        function bindInput(i, keymap) {
          inputs[i] = { keys: {}, touchSteer: 0, touchGas: 0, steerSmoothed: 0, keymap };
        }

        const keyMaps = [
          { left: ["ArrowLeft", "a", "A"], right: ["ArrowRight", "d", "D"], up: ["ArrowUp", "w", "W"], down: ["ArrowDown", "s", "S"] },
          { left: ["j", "J"], right: ["l", "L"], up: ["i", "I"], down: ["k", "K"] },
          { left: ["v", "V"], right: ["n", "N"], up: ["f", "F"], down: ["c", "C"] },
          { left: ["4", "Numpad4"], right: ["6", "Numpad6"], up: ["8", "Numpad8"], down: ["5", "Numpad5"] },
        ];

        function setMenu() {
          hudEl.classList.add("hidden");
          touchHud.classList.add("hidden");
          menuEl.classList.remove("hidden");
          menuEl.innerHTML = `
            <h1>Coast Sprint</h1>
            <p class="tag">Arcade oval racing — beat the bots, climb the levels. Works on PC &amp; iPad.</p>
            <div class="row">
              <button type="button" class="primary" data-mode="1">1 player</button>
              <button type="button" data-mode="2">2 players</button>
              <button type="button" data-mode="4">4 players</button>
            </div>
            <p class="hint"><strong>Keyboard:</strong> steer + ↑ gas · ↓ brake &nbsp;·&nbsp; <strong>Mouse:</strong> hold <em>left button</em> on the track, move sideways to steer &nbsp;·&nbsp; <strong>Touch:</strong> slide the bottom bar to steer, tap <strong>GAS</strong> to accelerate</p>
          `;
          menuEl.querySelectorAll("[data-mode]").forEach((btn) => {
            btn.addEventListener("click", () => {
              config.players = +btn.getAttribute("data-mode");
              showLevelSelect();
            });
          });
        }

        function showLevelSelect() {
          menuEl.innerHTML = `
            <h1>Pick a track</h1>
            <p class="tag">${config.players} human driver(s) · choose difficulty by track</p>
            <div class="levels">
              ${TRACKS.map(
                (t, i) =>
                  `<button type="button" data-level="${i}"><strong>${t.name}</strong><br /><span style="opacity:.7">${t.laps} laps</span></button>`
              ).join("")}
            </div>
            <div class="row">
              <button type="button" id="back">Back</button>
            </div>
          `;
          menuEl.querySelectorAll("[data-level]").forEach((btn) => {
            btn.addEventListener("click", () => {
              config.trackIndex = +btn.getAttribute("data-level");
              config.laps = TRACKS[config.trackIndex].laps;
              startRace();
            });
          });
          menuEl.querySelector("#back").addEventListener("click", setMenu);
        }

        function resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener("resize", resize);
        resize();

        function viewportRectForPlayer(pidx) {
          const W = window.innerWidth;
          const H = window.innerHeight;
          const n = config.players;
          if (n <= 1) return { left: 0, top: 0, width: W, height: H };
          if (n === 2) return pidx === 0 ? { left: 0, top: 0, width: W, height: H * 0.5 } : { left: 0, top: H * 0.5, width: W, height: H * 0.5 };
          const col = pidx % 2;
          const row = pidx >> 1;
          return { left: col * W * 0.5, top: row * H * 0.5, width: W * 0.5, height: H * 0.5 };
        }

        let controlsBound = false;
        /** @type {number} */
        let raceTime = 0;

        function bindControlsOnce() {
          if (controlsBound) return;
          controlsBound = true;
          const steerPad = document.getElementById("touchSteerPad");
          const gasBtn = document.getElementById("touchGas");

          function steerNorm(clientX, el) {
            const r = el.getBoundingClientRect();
            const t = ((clientX - r.left) / r.width) * 2 - 1;
            return Math.max(-1, Math.min(1, Math.pow(Math.abs(t), 0.85) * Math.sign(t)));
          }
          function onSteer(ev) {
            ev.preventDefault();
            const cx = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX) ?? 0;
            if (!inputs[0]) return;
            inputs[0].touchSteer = steerNorm(cx, steerPad);
          }
          steerPad.addEventListener("touchstart", onSteer, { passive: false });
          steerPad.addEventListener("touchmove", onSteer, { passive: false });
          steerPad.addEventListener(
            "touchend",
            (e) => {
              e.preventDefault();
              if (inputs[0]) inputs[0].touchSteer = 0;
            },
            { passive: false }
          );

          gasBtn.addEventListener(
            "touchstart",
            (e) => {
              e.preventDefault();
              if (inputs[0]) inputs[0].touchGas = 1;
            },
            { passive: false }
          );
          gasBtn.addEventListener(
            "touchend",
            (e) => {
              e.preventDefault();
              if (inputs[0]) inputs[0].touchGas = 0;
            },
            { passive: false }
          );
          gasBtn.addEventListener(
            "touchcancel",
            (e) => {
              e.preventDefault();
              if (inputs[0]) inputs[0].touchGas = 0;
            },
            { passive: false }
          );
          gasBtn.addEventListener(
            "mousedown",
            () => inputs[0] && (inputs[0].touchGas = 1),
            false
          );
          gasBtn.addEventListener(
            "mouseup",
            () => inputs[0] && (inputs[0].touchGas = 0),
            false
          );
          gasBtn.addEventListener(
            "mouseleave",
            () => inputs[0] && (inputs[0].touchGas = 0),
            false
          );

          function steerFromViewport(ev) {
            const r = viewportRectForPlayer(0);
            const lx = ev.clientX - r.left;
            const nx = Math.max(-1, Math.min(1, (lx / r.width) * 2 - 1));
            pointerDrive.steer = nx * 1.28;
            pointerDrive.gas = (ev.buttons & 1) !== 0;
          }

          canvas.addEventListener(
            "pointerdown",
            (e) => {
              if (!geom || !menuEl.classList.contains("hidden")) return;
              if (resultsActive) return;
              if (e.pointerType !== "mouse") return;
              pointerDrive.useMouse = true;
              try {
                canvas.setPointerCapture(e.pointerId);
              } catch (_) {}
              pointerDrive.gas = true;
              steerFromViewport(e);
            },
            false
          );
          canvas.addEventListener(
            "pointermove",
            (e) => {
              if (!pointerDrive.useMouse || e.pointerType !== "mouse") return;
              if (!geom || countdown !== null) return;
              steerFromViewport(e);
            },
            false
          );
          function endMouse() {
            pointerDrive.active = false;
            pointerDrive.gas = false;
            pointerDrive.steer = 0;
            pointerDrive.useMouse = false;
          }
          canvas.addEventListener("pointerup", endMouse, false);
          canvas.addEventListener("pointercancel", endMouse, false);
        }

        function startRace() {
          menuEl.classList.add("hidden");
          hudEl.classList.remove("hidden");
          touchHud.classList.remove("hidden");
          geom = geomFromTrack(config.trackIndex);
          const totalSlots = Math.max(4, config.players + 3);
          const humans = config.players;
          const aiCount = Math.max(0, 4 - humans);
          config.ai = aiCount;
          cars = [];
          const spread = (TAU / 8) * 0.35;
          for (let p = 0; p < 4; p++) {
            const st = -TAU / 4 - p * spread;
            cars.push(makeCar(p, geom, st));
          }
          for (let p = 0; p < 4; p++) bindInput(p, keyMaps[p]);
          finishedCount = 0;
          startTime = performance.now();
          countdown = 3;
          lastT = startTime;
          lapUnlockAt = 0;
          raceTime = 0;
          skidMarks = [];
          Object.assign(pointerDrive, { active: false, steer: 0, gas: false, useMouse: false });
          bindControlsOnce();
        }

        function keyActive(inp, kind) {
          const km = inp.keymap;
          const arr = km[kind];
          for (const k of arr) if (inp.keys[k]) return true;
          return false;
        }

        function tickAi(car, dt) {
          const g = geom;
          const midRx = ((g.rxo + g.rxi) * 0.5) * 0.94;
          const midRy = ((g.ryo + g.ryi) * 0.5) * 0.94;
          const targetT = car.progress * TAU + TAU * 0.05 + car.i * 0.02;
          const tx = g.tcx + Math.cos(targetT) * midRx;
          const ty = g.tcy + Math.sin(targetT) * midRy;
          const dx = tx - car.x;
          const dy = ty - car.y;
          const targetAng = Math.atan2(dy, dx);
          let diff = targetAng - car.ang;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          const steer = Math.max(-1, Math.min(1, diff * 1.85));
          const throttle = 0.85 + Math.sin(performance.now() * 0.003 + car.i) * 0.08;
          applyCarPhysics(car, dt, steer, throttle, 0);
        }

        function applyCarPhysics(car, dt, steer, throttle, brake) {
          const g = geom;
          const maxSpd = 590;
          const accelF = 410;
          const lateralGrip = 22;
          const rollDrag = 3.8;
          const yawBase = 3.05;

          let fx = Math.cos(car.ang);
          let fy = Math.sin(car.ang);
          let rx = -fy;
          let ry = fx;

          let spd = Math.hypot(car.vx, car.vy);
          let fwd = car.vx * fx + car.vy * fy;
          let lat = car.vx * rx + car.vy * ry;

          const steerRamp = 0.38 + Math.min(Math.abs(fwd) / 300, 0.92);
          const rev = fwd < -35;
          car.ang += steer * yawBase * steerRamp * (rev ? -0.92 : 1) * dt;

          fx = Math.cos(car.ang);
          fy = Math.sin(car.ang);
          rx = -fy;
          ry = fx;

          fwd = car.vx * fx + car.vy * fy;
          lat = car.vx * rx + car.vy * ry;

          if (throttle > 0) fwd += accelF * throttle * dt;
          if (throttle <= 0) fwd *= Math.max(0, 1 - rollDrag * dt * 0.22);

          if (brake > 0) {
            const b = brake;
            fwd *= Math.max(0, 1 - b * 3.2 * dt);
            lat *= Math.max(0, 1 - b * lateralGrip * 0.045 * dt);
          }

          lat *= Math.exp(-lateralGrip * dt);
          fwd *= Math.exp(-rollDrag * dt * 0.05);

          car.vx = fwd * fx + lat * rx;
          car.vy = fwd * fy + lat * ry;

          spd = Math.hypot(car.vx, car.vy);
          if (spd > maxSpd) {
            const r = maxSpd / spd;
            car.vx *= r;
            car.vy *= r;
            spd = maxSpd;
          }

          if (!car.finished && Math.abs(lat) > 110 && spd > 180 && Math.random() < 0.28) {
            skidMarks.push({ x: car.x - fx * 16, y: car.y - fy * 16, a: car.ang, life: 1 });
            if (skidMarks.length > 520) skidMarks.splice(0, skidMarks.length - 520);
          }

          let nx = car.x + car.vx * dt;
          let ny = car.y + car.vy * dt;
          if (!inRoad(g, nx, ny)) {
            const snp = snapToRoad(g, nx, ny);
            const sp2 = Math.hypot(car.vx, car.vy);
            const dot = car.vx * snp.nx + car.vy * snp.ny;
            car.vx -= 2 * dot * snp.nx;
            car.vy -= 2 * dot * snp.ny;
            car.vx *= 0.74;
            car.vy *= 0.74;
            car.x = snp.x;
            car.y = snp.y;
            if (sp2 > 50) {
              car.vx += snp.nx * 26;
              car.vy += snp.ny * 26;
            }
          } else {
            car.x = nx;
            car.y = ny;
          }
          const pang = Math.atan2(car.y - g.tcy, car.x - g.tcx);
          let prog = (pang + TAU / 4) / TAU;
          if (prog < 0) prog += 1;
          if (prog >= 1) prog -= 1;
          const prev = car.progress;
          const crossed = prev > 0.82 && prog < 0.2;
          const now = performance.now();
          if (crossed && now >= lapUnlockAt) {
            const human = car.i < config.players;
            if (human && !car.finished) {
              car.completedLaps++;
              if (car.completedLaps >= config.laps) {
                car.finished = true;
                finishedCount++;
                car.finishRank = finishedCount;
              }
            }
          }
          car.progress = prog;
        }

        function drawWorld(vx, vy, vw, vh, follow) {
          const g = geom;
          const pad = 80;
          const scale = Math.min(vw, vh) / (Math.max(g.rxo, g.ryo) * 2 + pad);
          const camX = follow.smoothCamX;
          const camY = follow.smoothCamY;
          ctx.save();
          ctx.beginPath();
          ctx.rect(vx, vy, vw, vh);
          ctx.clip();
          ctx.translate(vx + vw / 2, vy + vh / 2);
          ctx.scale(scale, scale);
          ctx.translate(-camX, -camY);

          const gx = ctx.createRadialGradient(g.tcx - 140, g.tcy - 90, 50, g.tcx, g.tcy, Math.max(g.rxo, g.ryo) * 2.8);
          gx.addColorStop(0, "#1f2f48");
          gx.addColorStop(0.48, "#0f1624");
          gx.addColorStop(1, "#06090e");
          ctx.fillStyle = gx;
          ctx.fillRect(-2600, -2600, 5200, 5200);

          const pavement = ctx.createRadialGradient(g.tcx, g.tcy, 40, g.tcx, g.tcy, (g.rxo + g.rxi) * 0.72);
          pavement.addColorStop(0, "#2a3545");
          pavement.addColorStop(0.72, "#1a222e");
          pavement.addColorStop(1, "#121820");
          ctx.fillStyle = pavement;
          ctx.globalAlpha = 0.55;
          ctx.beginPath();
          ellipsePath(ctx, (g.cxo + g.cxi) * 0.5, (g.cyo + g.cyi) * 0.5, ((g.rxo + g.rxi) / 2) * 1.12, ((g.ryo + g.ryi) / 2) * 1.12);
          ctx.fill();
          ctx.globalAlpha = 1;

          ctx.strokeStyle = "rgba(255,60,70,.28)";
          ctx.lineWidth = 18 / scale;
          ctx.lineCap = "round";
          ctx.beginPath();
          ellipsePath(ctx, g.cxo, g.cyo, g.rxo + 48, g.ryo + 48);
          ctx.stroke();
          ctx.beginPath();
          ellipsePath(ctx, g.cxi, g.cyi, g.rxi - 42, g.ryi - 42);
          ctx.stroke();

          ctx.strokeStyle = "rgba(230,238,246,.06)";
          ctx.lineWidth = 3 / scale;
          ctx.beginPath();
          for (let t = 0; t <= 96; t++) {
            const a = (t / 96) * TAU;
            const midRx = (g.rxo + g.rxi) * 0.5;
            const midRy = (g.ryo + g.ryi) * 0.5;
            const mx = g.cxo + Math.cos(a) * midRx * 1.04;
            const my = g.cyo + Math.sin(a) * midRy * 1.04;
            if (t === 0) ctx.moveTo(mx, my);
            else ctx.lineTo(mx, my);
          }
          ctx.stroke();

          ctx.strokeStyle = "rgba(245,247,252,.14)";
          ctx.lineWidth = 8 / scale;
          ctx.beginPath();
          ellipsePath(ctx, g.cxo, g.cyo, g.rxo + 32, g.ryo + 32);
          ctx.stroke();
          ctx.beginPath();
          ellipsePath(ctx, g.cxi, g.cyi, g.rxi - 32, g.ryi - 32);
          ctx.stroke();

          ctx.strokeStyle = "rgba(255,230,120,.52)";
          ctx.lineWidth = 2.5 / scale;
          ctx.setLineDash([(20 / scale) | 0, (16 / scale) | 0]);
          ctx.lineDashOffset = -(raceTime * 0.42) % 80;
          ctx.beginPath();
          ellipsePath(ctx, (g.cxo + g.cxi) * 0.5, (g.cyo + g.cyi) * 0.5, ((g.rxo + g.rxi) / 2) * 0.99, ((g.ryo + g.ryi) / 2) * 0.99);
          ctx.stroke();
          ctx.lineDashOffset = 0;

          ctx.setLineDash([]);
          ctx.lineWidth = 2 / scale;
          ctx.fillStyle = "rgba(255,255,255,.55)";
          ctx.beginPath();
          ctx.arc(
            g.tcx + Math.cos(-TAU / 4) * ((g.rxo + g.rxi) / 2) * 0.92,
            g.tcy + Math.sin(-TAU / 4) * ((g.ryo + g.ryi) / 2) * 0.92,
            11 / scale,
            0,
            TAU
          );
          ctx.fill();

          for (const sm of skidMarks) {
            const al = Math.max(0.12, sm.life * 0.35);
            ctx.save();
            ctx.translate(sm.x, sm.y);
            ctx.rotate(sm.a);
            ctx.fillStyle = `rgba(12,14,18,${al})`;
            ctx.beginPath();
            ctx.ellipse(0, 0, 7, 3, 0, 0, TAU);
            ctx.fill();
            ctx.restore();
          }

          for (const car of cars) {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.ang);
            const w = 20;
            const h = 10;
            ctx.fillStyle = "rgba(0,0,0,.45)";
            ctx.beginPath();
            ctx.ellipse(0, 3.5, w * 0.55, h * 0.9, 0, 0, TAU);
            ctx.fill();

            ctx.fillStyle = carColor(car.i);
            ctx.shadowColor = carColor(car.i);
            ctx.shadowBlur = 14;
            ctx.beginPath();
            drawCarBody(ctx, -w / 2, -h / 2, w, h, 4);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(8,10,14,.72)";
            ctx.fillRect(-w / 2 + 2.5, -h / 2 + 2, w - 5, h - 4);

            const hl = ctx.createLinearGradient(w * 0.2, -h * 0.3, w * 0.95, -h * 0.05);
            hl.addColorStop(0, "rgba(255,255,255,0)");
            hl.addColorStop(0.55, "rgba(200,230,255,.55)");
            hl.addColorStop(1, "rgba(180,220,255,.18)");
            ctx.fillStyle = hl;
            ctx.fillRect(w * 0.15, -h * 0.35, w * 0.75, h * 0.32);
            ctx.restore();
          }

          ctx.restore();
          ctx.save();
          ctx.beginPath();
          ctx.rect(vx, vy, vw, vh);
          ctx.clip();
          const vign = ctx.createRadialGradient(vx + vw * 0.5, vy + vh * 0.52, vw * 0.12, vx + vw * 0.5, vy + vh * 0.5, vw * 0.85);
          vign.addColorStop(0, "rgba(0,0,0,0)");
          vign.addColorStop(1, "rgba(0,0,0,.22)");
          ctx.fillStyle = vign;
          ctx.fillRect(vx, vy, vw, vh);
          ctx.restore();
        }

        function drawCarBody(c, x, y, w, h, r) {
          if (typeof c.roundRect === "function") c.roundRect(x, y, w, h, r);
          else c.rect(x, y, w, h);
        }

        function ellipsePath(c, cx, cy, rx, ry) {
          for (let t = 0; t <= 64; t++) {
            const a = (t / 64) * TAU;
            const x = cx + Math.cos(a) * rx;
            const y = cy + Math.sin(a) * ry;
            if (t === 0) c.moveTo(x, y);
            else c.lineTo(x, y);
          }
          c.closePath();
        }

        window.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && resultsActive) {
            setMenu();
            resultsActive = false;
            geom = null;
            cars = [];
            return;
          }
          for (let p = 0; p < inputs.length; p++) {
            if (!inputs[p]) continue;
            inputs[p].keys[e.key] = true;
          }
        });
        window.addEventListener("keyup", (e) => {
          for (let p = 0; p < inputs.length; p++) {
            if (!inputs[p]) continue;
            inputs[p].keys[e.key] = false;
          }
        });

        function frame(now) {
          const dt = Math.min(0.033, (now - lastT) / 1000);
          lastT = now;

          if (geom && cars.length) {
            for (const c of cars) {
              const k = c.finished ? 0.08 : 0.12;
              c.smoothCamX += (c.x - c.smoothCamX) * k;
              c.smoothCamY += (c.y - c.smoothCamY) * k;
            }
          }

          if (countdown !== null) {
            const elapsed = (now - startTime) / 1000;
            countdown = 3 - Math.floor(elapsed);
            if (countdown < 0) {
              countdown = null;
              lapUnlockAt = performance.now() + 1800;
            }
          }

          const g = geom;
          if (g && cars.length && countdown === null) {
            raceTime += dt;
            for (let i = skidMarks.length - 1; i >= 0; i--) {
              skidMarks[i].life -= 0.0028;
              if (skidMarks[i].life <= 0) skidMarks.splice(i, 1);
            }
            for (let p = 0; p < config.players; p++) {
              if (cars[p].finished) continue;
              const inp = inputs[p];
              let target = 0;
              if (keyActive(inp, "left")) target -= 1;
              if (keyActive(inp, "right")) target += 1;
              if (target === 0 && p === 0) {
                if (pointerDrive.useMouse) target = pointerDrive.steer;
                else if (inp.touchSteer) target = inp.touchSteer;
              }
              const rate = 12;
              inp.steerSmoothed += (target - inp.steerSmoothed) * Math.min(1, rate * dt);

              let th = 0;
              if (keyActive(inp, "up")) th = 1;
              else if (p === 0 && inp.touchGas > 0) th = 0.96;
              else if (p === 0 && pointerDrive.useMouse && pointerDrive.gas) th = 1;
              const br = keyActive(inp, "down") ? 1 : 0;
              applyCarPhysics(cars[p], dt, inp.steerSmoothed, th, br);
            }
            for (let b = config.players; b < 4; b++) {
              if (!cars[b].finished) tickAi(cars[b], dt);
            }
          }

          const w = window.innerWidth;
          const h = window.innerHeight;
          ctx.fillStyle = "#06080c";
          ctx.fillRect(0, 0, w, h);

          if (geom && cars.length) {
            const n = config.players;
            if (n === 1) {
              drawWorld(0, 0, w, h, cars[0]);
            } else if (n === 2) {
              drawWorld(0, 0, w, h * 0.5, cars[0]);
              drawWorld(0, h * 0.5, w, h * 0.5, cars[1]);
            } else {
              const hw = w * 0.5;
              const hh = h * 0.5;
              drawWorld(0, 0, hw, hh, cars[0]);
              drawWorld(hw, 0, hw, hh, cars[1]);
              drawWorld(0, hh, hw, hh, cars[2]);
              drawWorld(hw, hh, hw, hh, cars[3]);
            }
          }

          if (countdown !== null && countdown >= 0) {
            ctx.fillStyle = "rgba(6,8,12,.45)";
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#e8eef7";
            ctx.font = "bold " + Math.min(w, h) * 0.18 + "px system-ui";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const msg = countdown > 0 ? String(countdown) : "GO";
            ctx.fillText(msg, w / 2, h / 2);
          }

          let hud = "";
          if (geom && cars[0]) {
            const t = TRACKS[config.trackIndex];
            const cur = Math.min(config.laps, cars[0].completedLaps + 1);
            const sp0 = Math.hypot(cars[0].vx, cars[0].vy);
            const kph = Math.round(sp0 * 0.12);
            hud = `${t.name} · ${kph} km/h · Lap ${cur}/${config.laps}`;
            if (cars[0].finished) hud += " · Finished P" + cars[0].finishRank;
          }
          hudEl.textContent = hud;

          const allDone = !!(cars.length && cars.slice(0, config.players).every((c) => c.finished));
          resultsActive = allDone && !!geom && countdown === null;
          if (resultsActive) touchHud.classList.add("hidden");
          else if (geom && menuEl.classList.contains("hidden")) touchHud.classList.remove("hidden");
          if (allDone && geom) {
            ctx.fillStyle = "rgba(6,8,12,.55)";
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#e8eef7";
            ctx.font = "600 " + Math.min(w, h) * 0.06 + "px system-ui";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const lines = cars
              .slice(0, config.players)
              .map((c) => `P${c.i + 1}: place ${c.finishRank}`)
              .join(" · ");
            ctx.fillText("Race complete", w / 2, h / 2 - 20);
            ctx.font = "400 " + Math.min(w, h) * 0.035 + "px system-ui";
            ctx.fillText(lines, w / 2, h / 2 + 22);
            ctx.fillText("Tap or press Enter for menu", w / 2, h / 2 + 58);
          }

          requestAnimationFrame(frame);
        }

        window.addEventListener(
          "pointerdown",
          (e) => {
            if (!resultsActive || !geom) return;
            if (!menuEl.classList.contains("hidden")) return;
            e.preventDefault();
            setMenu();
            resultsActive = false;
            geom = null;
            cars = [];
          },
          true
        );

        requestAnimationFrame(frame);

        setMenu();
      })();
    </script>
  </body>
</html>
