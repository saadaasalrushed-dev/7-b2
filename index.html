<!DOCTYPE html>
<!-- Aurora Ridge — pseudo-3D adventure racer. Push to repo root for GitHub Pages -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Aurora Ridge — Adventure Run</title>
    <style>
      :root {
        color-scheme: dark;
        --ui: #f0f6ff;
        --glass: rgba(12, 18, 36, 0.78);
        --accent: #6ef0d8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: #070a14;
        color: var(--ui);
        touch-action: none;
        user-select: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        background: #0a1528;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        background: radial-gradient(ellipse 90% 70% at 50% 30%, #1a2850 0%, #060912 75%);
        z-index: 5;
        gap: 0.75rem;
      }
      #overlay h1 {
        margin: 0;
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(120deg, #b8f4ff, #6ef0d8, #ffd88a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #overlay .sub {
        margin: 0 0 0.5rem;
        max-width: 22rem;
        text-align: center;
        font-size: 0.95rem;
        opacity: 0.85;
        line-height: 1.45;
      }
      .rows {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        max-width: 28rem;
      }
      .rows button {
        font: inherit;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--glass);
        color: var(--ui);
        padding: 0.6rem 1rem;
        border-radius: 12px;
        min-height: 48px;
        text-align: left;
        transition: border-color 0.15s, transform 0.1s;
      }
      .rows button:hover,
      .rows button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .rows button:active {
        transform: scale(0.98);
      }
      .rows button strong {
        display: block;
        font-size: 0.95rem;
      }
      .rows button span {
        font-size: 0.78rem;
        opacity: 0.7;
      }
      .rows button.primary {
        background: linear-gradient(160deg, rgba(40, 120, 120, 0.45), rgba(15, 40, 50, 0.95));
        border-color: rgba(110, 240, 216, 0.38);
      }
      .hint {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        opacity: 0.55;
        text-align: center;
        max-width: 26rem;
        line-height: 1.55;
      }
      #hud {
        position: absolute;
        left: 10px;
        top: max(10px, env(safe-area-inset-top));
        right: auto;
        z-index: 2;
        font-size: 12px;
        line-height: 1.38;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 14px rgba(0, 20, 40, 0.8);
        pointer-events: none;
      }
      #touchCtrl {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      #touchCtrl .pad {
        position: absolute;
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        height: clamp(110px, 28vh, 190px);
        pointer-events: auto;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(180deg, rgba(30, 45, 80, 0.35), rgba(8, 12, 22, 0.65));
        touch-action: none;
      }
      #touchCtrl .gas {
        position: absolute;
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + clamp(110px, 28vh, 190px) + 10px);
        width: min(130px, 30vw);
        height: clamp(56px, 13vh, 92px);
        pointer-events: auto;
        border-radius: 16px;
        border: 1px solid rgba(110, 240, 216, 0.35);
        background: linear-gradient(180deg, rgba(50, 130, 120, 0.45), rgba(12, 45, 50, 0.9));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: rgba(220, 255, 246, 0.9);
        touch-action: none;
      }
      #touchCtrl .boost {
        position: absolute;
        left: max(8px, env(safe-area-inset-left));
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + clamp(110px, 28vh, 190px) + 10px);
        width: min(130px, 30vw);
        height: clamp(56px, 13vh, 92px);
        pointer-events: auto;
        border-radius: 16px;
        border: 1px solid rgba(255, 184, 90, 0.45);
        background: linear-gradient(180deg, rgba(140, 90, 40, 0.5), rgba(40, 25, 10, 0.88));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(255, 230, 180, 0.95);
        touch-action: none;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="hud" class="hidden"></div>
      <div id="touchCtrl" class="hidden" aria-hidden="true">
        <div class="pad" id="steerPad" title="Slide to steer"></div>
        <div class="gas" id="gasBtn">GAS</div>
        <div class="boost" id="boostBtn">NITRO</div>
      </div>
      <div id="overlay"></div>
    </div>

    <script>
      (function () {
        const TAU = Math.PI * 2;
        const SEG_LEN = 200;
        const ROAD_W = 2000;
        const RUMBLE_W = 1200;
        const LANES = 3;
        const LANE_W = ROAD_W / LANES;

        /** @type {{ name: string, tag: string, sky: [string,string], fog: string, roadLight: string, roadDark: string, rumble: string, grass: string, star: string, goal: number }}[] */
        const REGIONS = [
          {
            name: "Emerald Reach",
            tag: "Coastal highway · wind & stars",
            sky: ["#1a5080", "#2a4088"],
            fog: "#4a6898",
            roadLight: "#4a5570",
            roadDark: "#3a4460",
            rumble: "#d04a5a",
            grass: "#1a6848",
            star: "#fff4a8",
            goal: 90000,
          },
          {
            name: "Crimson Drift",
            tag: "Neon canyon · violet storm",
            sky: ["#280828", "#180430"],
            fog: "#5a3870",
            roadLight: "#4a4468",
            roadDark: "#323048",
            rumble: "#e03070",
            grass: "#2a0828",
            star: "#ff90e8",
            goal: 120000,
          },
          {
            name: "Sunforge Line",
            tag: "Desert burn · long straights",
            sky: ["#c86020", "#904020"],
            fog: "#c09060",
            roadLight: "#706050",
            roadDark: "#504840",
            rumble: "#f0c040",
            grass: "#6a5020",
            star: "#ffffc0",
            goal: 150000,
          },
        ];

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d", { alpha: false });
        const overlay = document.getElementById("overlay");
        const hudEl = document.getElementById("hud");
        const touchCtrl = document.getElementById("touchCtrl");
        const steerPad = document.getElementById("steerPad");
        const gasBtn = document.getElementById("gasBtn");
        const boostBtn = document.getElementById("boostBtn");

        let W = 800;
        let H = 600;
        let dpr = 1;
        let camDepth = 0.84;
        let horizonY = 0;

        /** @type {number} */
        let regionIndex = 0;
        let road = [];
        let roadLen = 0;
        let totalLen = 0;

        let player = { x: 0, z: 0, speed: 0, maxSpeed: 24000, accel: 14000, brake: 24000, nitro: 100 };
        let steerTarget = 0;
        let steerSmooth = 0;
        let keys = {};
        let touchSteer = 0;
        let touchGas = 0;
        let touchBoost = 0;
        let pointerSteer = 0;
        let pointerGas = false;
        let pointerBoost = false;
        let mouseMode = false;

        let stars = [];
        let traffic = [];
        let boostPads = new Set();

        let distanceRun = 0;
        let starsCollected = 0;
        let running = false;
        let gameOver = false;
        let won = false;
        let lastT = 0;
        let audioCtx = null;
        let controlsBound = false;

        function laneToX(lane) {
          return (lane - 1) * LANE_W;
        }

        function buildRoad() {
          road = [];
          const N = 2200;
          let y = 0;
          let cumX = 0;
          for (let i = 0; i < N; i++) {
            const t = i / N;
            let curve = Math.sin(t * TAU * 6) * 1.2 + Math.sin(t * TAU * 14) * 0.45;
            if (i > 80 && i < 180) curve += 2.4;
            if (i > 400 && i < 520) curve -= 2.1;
            if (i > 900 && i < 1100) curve += 1.8;
            y += Math.sin(t * TAU * 18) * 35;
            cumX += curve * 4;
            const col = i % 2;
            road.push({
              i,
              curve,
              y,
              wX: cumX,
              col,
            });
          }
          roadLen = road.length;
          totalLen = roadLen * SEG_LEN;
          stars = [];
          traffic = [];
          boostPads.clear();
          for (let i = 50; i < roadLen - 50; i += 9) {
            if (Math.random() < 0.35) stars.push({ seg: i, lane: (Math.random() * 3) | 0, got: false });
          }
          for (let i = 120; i < roadLen - 120; i += 17) {
            if (Math.random() < 0.4) traffic.push({ seg: i, lane: (Math.random() * 3) | 0, zOff: Math.random() * SEG_LEN });
          }
          for (let i = 40; i < roadLen; i += 28) boostPads.add(i);
        }

        function resize() {
          dpr = Math.min(2, window.devicePixelRatio || 1);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = (W * dpr) | 0;
          canvas.height = (H * dpr) | 0;
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          horizonY = H * (0.32 + Math.min(180, H) / H * 0.08);
        }
        window.addEventListener("resize", resize);
        resize();

        function project(camWX, camWY, camZ, worldX, worldY, worldZ, width, height) {
          const dz = worldZ - camZ;
          if (dz < 8) return null;
          const sc = camDepth / dz;
          const sx = width / 2 + (worldX - camWX) * sc * width * 0.42;
          const sy = height / 2 - (worldY - camWY) * sc * height * 0.48;
          const sw = ROAD_W * sc * width * 0.00022;
          return { sx, sy, sw, sc };
        }

        function playTone(freq, dur) {
          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.value = 0.04;
            o.start();
            o.stop(audioCtx.currentTime + dur);
          } catch (_) {}
        }

        function drawBackground(R) {
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, R.sky[0]);
          g.addColorStop(0.55, R.sky[1]);
          g.addColorStop(1, R.fog);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "rgba(255,255,255,0.04)";
          for (let i = 0; i < 28; i++) {
            const x = ((i * 137 + performance.now() * 0.01) % (W + 120)) - 60;
            const y = (i / 28) * horizonY * 0.92;
            ctx.fillRect(x, y, 2 + (i % 3), 2);
          }
        }

        function drawRoadView(R) {
          const groundG = ctx.createLinearGradient(0, horizonY, 0, H);
          groundG.addColorStop(0, R.grass);
          groundG.addColorStop(1, "#05080c");
          ctx.fillStyle = groundG;
          ctx.fillRect(0, horizonY, W, H - horizonY);
          ctx.fillStyle = "rgba(255,255,255,0.035)";
          for (let yy = horizonY + 40; yy < H; yy += 14) {
            const wob = Math.sin(yy * 0.018 + player.z * 0.003) * 40;
            ctx.fillRect(wob + 30, yy, W - 60, 1);
          }

          const baseIdxWrapped = (((player.z / SEG_LEN) | 0) % roadLen + roadLen) % roadLen;
          const camZ = player.z;
          const camWX = road[baseIdxWrapped].wX + player.x * 420;
          const camWY = road[baseIdxWrapped].y + 1100;

          const drawDist = 160;
          let maxY = H + 400;

          for (let n = drawDist; n >= 2; n--) {
            const segIdx = (baseIdxWrapped + n) % roadLen;
            const nextIdx = (segIdx + 1) % roadLen;

            const wz0 = camZ + n * SEG_LEN;
            const wz1 = camZ + (n + 1) * SEG_LEN;
            const s0 = road[segIdx];
            const s1 = road[nextIdx];

            const p0 = project(camWX, camWY, camZ, s0.wX, s0.y, wz0, W, H);
            const p1 = project(camWX, camWY, camZ, s1.wX, s1.y, wz1, W, H);
            if (!p0 || !p1) continue;

            const x0 = p0.sx,
              y0 = p0.sy,
              w0 = Math.max(p0.sw, 1.8);
            const x1 = p1.sx,
              y1 = p1.sy,
              w1 = Math.max(p1.sw, 1.8);
            const yTop = Math.min(y0, y1);
            if (yTop > maxY) continue;
            maxY = yTop;

            const col = s0.col === 0 ? R.roadLight : R.roadDark;
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(x0 - w0, y0);
            ctx.lineTo(x0 + w0, y0);
            ctx.lineTo(x1 + w1, y1);
            ctx.lineTo(x1 - w1, y1);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = R.rumble;
            const rb = Math.max(w0 * 0.1, 2);
            ctx.beginPath();
            ctx.moveTo(x0 - w0 - rb, y0);
            ctx.lineTo(x0 - w0, y0);
            ctx.lineTo(x1 - w1, y1);
            ctx.lineTo(x1 - w1 - rb, y1);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x0 + w0, y0);
            ctx.lineTo(x0 + w0 + rb, y0);
            ctx.lineTo(x1 + w1 + rb, y1);
            ctx.lineTo(x1 + w1, y1);
            ctx.closePath();
            ctx.fill();

            if (boostPads.has(segIdx)) {
              ctx.fillStyle = "rgba(110,240,200,0.35)";
              ctx.fillRect(x1 - w1 * 0.5, y1 - 4, w1, 4);
            }
          }
        }

        function drawStarsSprite(R) {
          const baseIdxWrapped = (((player.z / SEG_LEN) | 0) % roadLen + roadLen) % roadLen;
          const camZ = player.z;
          const camWX = road[baseIdxWrapped].wX + player.x * 420;
          const camWY = road[baseIdxWrapped].y + 1100;
          for (const st of stars) {
            if (st.got) continue;
            const segIdx = st.seg % roadLen;
            const z = st.seg * SEG_LEN + SEG_LEN * 0.5;
            const ahead = z - camZ;
            if (ahead < 20 || ahead > SEG_LEN * 110) continue;
            const wx = road[segIdx].wX + laneToX(st.lane);
            const wy = road[segIdx].y;
            const p = project(camWX, camWY, camZ, wx, wy + 520, z, W, H);
            if (!p || p.sy < horizonY - 20 || p.sy > H + 50) continue;
            const sz = Math.max(12, 520 * p.sc);
            ctx.fillStyle = R.star;
            ctx.shadowColor = R.star;
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, sz, 0, TAU);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        function drawTraffic(R) {
          const baseIdxWrapped = (((player.z / SEG_LEN) | 0) % roadLen + roadLen) % roadLen;
          const camZ = player.z;
          const camWX = road[baseIdxWrapped].wX + player.x * 420;
          const camWY = road[baseIdxWrapped].y + 1100;
          for (const tr of traffic) {
            const zi = tr.seg * SEG_LEN + tr.zOff;
            const ahead = zi - camZ;
            if (ahead < -SEG_LEN * 3 || ahead > SEG_LEN * 100) continue;
            const si = tr.seg % roadLen;
            const wx = road[si].wX + laneToX(tr.lane);
            const wy = road[si].y;
            const p = project(camWX, camWY, camZ, wx, wy + 480, zi, W, H);
            if (!p || p.sy < horizonY) continue;
            const bw = Math.max(10, p.sw * 0.32);
            const bh = bw * 0.62;
            ctx.fillStyle = "#1a2434";
            ctx.fillRect(p.sx - bw / 2, p.sy - bh, bw, bh);
            ctx.fillStyle = "#ff5050";
            ctx.fillRect(p.sx - bw * 0.35, p.sy - bh * 0.95, bw * 0.7, bh * 0.2);
          }
        }

        function drawPlayerCar(R, speedRatio) {
          const cx = W * 0.5 + steerSmooth * W * 0.04;
          const cy = H * 0.86;
          const bw = W * 0.16;
          const bh = W * 0.06;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(steerSmooth * 0.15);
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.beginPath();
          ctx.ellipse(0, bh * 0.5, bw * 0.45, bh * 0.35, 0, 0, TAU);
          ctx.fill();

          const body = ctx.createLinearGradient(-bw / 2, -bh, bw / 2, bh);
          body.addColorStop(0, "#304860");
          body.addColorStop(0.45, "#5a8098");
          body.addColorStop(1, "#203040");
          ctx.fillStyle = body;
          ctx.beginPath();
          if (typeof ctx.roundRect === "function") ctx.roundRect(-bw / 2, -bh, bw, bh, 10);
          else ctx.rect(-bw / 2, -bh, bw, bh);
          ctx.fill();

          ctx.fillStyle = "rgba(220,248,255,0.7)";
          ctx.fillRect(bw * 0.06, -bh * 0.85, bw * 0.35, bh * 0.35);

          if (speedRatio > 0.55 && player.nitro < 92) {
            const j = (performance.now() / 40) % 6;
            ctx.fillStyle = "rgba(120,230,255,0.35)";
            ctx.beginPath();
            ctx.moveTo(-bw * 0.45, bh * 0.1);
            ctx.lineTo(-bw * (0.78 + (j % 3) * 0.04), bh * 0.22);
            ctx.lineTo(-bw * 0.45, bh * 0.42);
            ctx.fill();
          }
          ctx.restore();
        }

        function drawHUD(region) {
          const kmh = Math.min(420, Math.round(player.speed / 72));
          const pct = Math.min(1, player.z / region.goal);
          const nt = Math.round(player.nitro);
          let line = `${region.name}  ·  ${kmh} km/h  ·  Stars ${starsCollected}`;
          line += `\nRun ${((player.z / 1000) | 0)}/${(region.goal / 1000) | 0} km  ·  NITRO ${nt}%`;
          hudEl.innerHTML =
            `<div>${line}</div>` +
            `<div style="margin-top:4px;width:${Math.min(220, W * 0.45)}px;height:8px;border-radius:4px;background:rgba(0,0,0,.36);overflow:hidden;display:inline-block;vertical-align:middle;">
              <div style="height:100%;width:${pct * 100}%;background:linear-gradient(90deg,#4af0d8,#ffb44d);"></div>
            </div>`;
        }

        function collectAndCollide(region) {
          const baseSeg = ((player.z / SEG_LEN) | 0) % roadLen;
          const carZ = player.z;

          for (const st of stars) {
            if (st.got) continue;
            const z = st.seg * SEG_LEN + SEG_LEN * 0.55;
            const dz = Math.abs(z - carZ);
            const want = (st.lane - 1) * 0.92;
            if (dz < SEG_LEN * 0.55 && Math.abs(player.x - want) < 0.48) {
              st.got = true;
              starsCollected++;
              playTone(660 + starsCollected * 40, 0.06);
              player.nitro = Math.min(100, player.nitro + 12);
              player.speed = Math.min(player.maxSpeed * 1.03, player.speed + 2800);
            }
          }

          for (const tr of traffic) {
            const zi = tr.seg * SEG_LEN + tr.zOff;
            const dz = Math.abs(zi - carZ);
            const want = (tr.lane - 1) * 0.92;
            if (dz < 800 && Math.abs(player.x - want) < 0.45) {
              player.speed *= 0.52;
              playTone(120, 0.12);
              player.x *= 0.6;
            }
          }

          if (boostPads.has(baseSeg % roadLen)) {
            player.speed = Math.min(player.maxSpeed * 1.06, player.speed + player.accel * 0.038);
          }
        }

        function step(dt) {
          const R = REGIONS[regionIndex];
          if (!running || gameOver) return;

          let steerIn = 0;
          if (keys["ArrowLeft"] || keys["a"] || keys["A"]) steerIn -= 1;
          if (keys["ArrowRight"] || keys["d"] || keys["D"]) steerIn += 1;
          if (!steerIn) {
            if (mouseMode && pointerGas) steerIn = pointerSteer;
            else steerIn = touchSteer;
          }

          steerSmooth += (steerIn - steerSmooth) * Math.min(1, 14 * dt);
          steerTarget = steerSmooth;

          let gas =
            Boolean(keys["ArrowUp"] || keys["w"] || keys["W"]) || touchGas > 0.5 || (mouseMode && pointerGas);
          let braking = Boolean(keys["ArrowDown"] || keys["s"] || keys["S"]);
          let nitroBoost = Boolean(
            keys["Space"] ||
              keys["ShiftLeft"] ||
              keys["ShiftRight"] ||
              touchBoost > 0.5 ||
              (mouseMode && pointerBoost)
          );

          if (!gas) {
            player.speed *= Math.pow(0.9975, dt * 60);
          } else {
            let mult = nitroBoost && player.nitro > 0.5 ? 2.05 : 1;
            player.speed += player.accel * dt * mult;
          }
          if (nitroBoost && player.nitro > 0) {
            player.nitro -= 32 * dt;
            player.speed = Math.min(player.maxSpeed * 1.25, player.speed);
          } else if (!nitroBoost) {
            player.nitro = Math.min(100, player.nitro + 6 * dt);
          }
          if (braking) player.speed -= player.brake * dt;
          player.speed = Math.max(0, Math.min(player.maxSpeed, player.speed));

          player.z += player.speed * dt;
          distanceRun += player.speed * dt;
          player.x += steerTarget * ((player.speed + 2400) * 0.000018) * 60 * dt;

          const laneLimit = 1.02;
          if (Math.abs(player.x) > laneLimit) {
            player.speed *= 0.985;
          }
          player.x *= 0.9995;

          if (player.z >= R.goal) {
            running = false;
            won = true;
            gameOver = true;
            showEnd(true);
            return;
          }
          collectAndCollide(R);
        }

        function render() {
          if (!running) return;
          const R = REGIONS[regionIndex];
          ctx.save();
          drawBackground(R);
          ctx.restore();

          drawRoadView(R);
          drawStarsSprite(R);
          drawTraffic(R);

          const spRatio = player.speed / player.maxSpeed;
          drawPlayerCar(R, spRatio);

          const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, W * 0.12, W * 0.5, H * 0.52, W * 0.72);
          vg.addColorStop(0, "transparent");
          vg.addColorStop(1, "rgba(0,0,0,0.38)");
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, W, H);

          drawHUD(R);
        }

        function frame(t) {
          const dt = Math.min(0.033, (t - lastT) / 1000) || 0.016;
          lastT = t;
          if (running) {
            step(dt);
            render();
          }
          requestAnimationFrame(frame);
        }

        function showMenu() {
          overlay.classList.remove("hidden");
          hudEl.classList.add("hidden");
          touchCtrl.classList.add("hidden");
          running = false;
          overlay.innerHTML = `
            <h1>Aurora Ridge</h1>
            <p class="sub">Pseudo‑3D highway run · stars · nitro · traffic · three regions.</p>
            <div class="rows">
              ${REGIONS.map(
                (r, i) =>
                  `<button type="button" class="${i === 0 ? "primary" : ""}" data-r="${i}"><strong>${r.name}</strong><span>${r.tag}<br />Goal · ${(
                    r.goal / 1000
                  ).toFixed(0)} km run</span></button>`
              ).join("")}
            </div>
            <div class="rows">
              <button type="button" id="howBtn">How to play</button>
            </div>
            <p class="hint">
              Keyboard: ← → steer · ↑ gas · ↓ brake · Space nitro · Mouse: hold left on road = gas + steering · Touch: slide bar = steer, GAS &amp; NITRO buttons
            </p>
          `;
          overlay.querySelectorAll("[data-r]").forEach((b) =>
            b.addEventListener("click", () => {
              regionIndex = +b.getAttribute("data-r");
              startGame();
            })
          );
          overlay.querySelector("#howBtn").addEventListener("click", () => {
            alert(
              "Reach the run distance shown in the HUD. Collect star shards for nitro refill and speed bursts. Crimson traffic slows you — slip past cleanly. Emerald boost strips add pace. Brake before tight bends."
            );
          });
        }

        function showEnd(success) {
          overlay.classList.remove("hidden");
          touchCtrl.classList.add("hidden");
          hudEl.classList.add("hidden");
          const R = REGIONS[regionIndex];
          overlay.innerHTML = `
            <h1>${success ? "Run complete!" : "Crashed out"}</h1>
            <p class="sub">
              Stars: ${starsCollected} · Distance: ${((player.z / 1000) | 0)} / ${(R.goal / 1000) | 0} km
            </p>
            <div class="rows">
              <button type="button" class="primary" id="again">Run again</button>
              <button type="button" id="menu">Regions</button>
            </div>
          `;
          overlay.querySelector("#again").addEventListener("click", startGame);
          overlay.querySelector("#menu").addEventListener("click", showMenu);
        }

        function startGame() {
          buildRoad();
          player = { z: SEG_LEN * 20, x: 0, speed: 12000, maxSpeed: 26000, accel: 15500, brake: 22000, nitro: 100 };
          steerSmooth = 0;
          starsCollected = 0;
          running = true;
          gameOver = false;
          won = false;
          lastT = performance.now();
          overlay.classList.add("hidden");
          hudEl.classList.remove("hidden");
          touchCtrl.classList.remove("hidden");
        }

        function bindInputs() {
          if (controlsBound) return;
          controlsBound = true;
          window.addEventListener(
            "keydown",
            (e) => {
              keys[e.code] = true;
              keys[e.key] = true;
            },
            false
          );
          window.addEventListener(
            "keyup",
            (e) => {
              keys[e.code] = false;
              keys[e.key] = false;
            },
            false
          );

          function padSteer(ev) {
            ev.preventDefault();
            const cx = ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX;
            const r = steerPad.getBoundingClientRect();
            touchSteer = Math.max(-1, Math.min(1, ((cx - r.left) / r.width) * 2 - 1));
          }
          steerPad.addEventListener("touchstart", padSteer, { passive: false });
          steerPad.addEventListener("touchmove", padSteer, { passive: false });
          steerPad.addEventListener("touchend", () => (touchSteer = 0), { passive: false });

          const setG = (v) => (e) => {
            e.preventDefault();
            touchGas = v;
          };
          gasBtn.addEventListener("touchstart", setG(1), { passive: false });
          gasBtn.addEventListener("touchend", setG(0), { passive: false });
          gasBtn.addEventListener("mousedown", () => (touchGas = 1));
          gasBtn.addEventListener("mouseup", () => (touchGas = 0));

          const setB = (v) => (e) => {
            e.preventDefault();
            touchBoost = v;
          };
          boostBtn.addEventListener("touchstart", setB(1), { passive: false });
          boostBtn.addEventListener("touchend", setB(0), { passive: false });
          boostBtn.addEventListener("mousedown", () => (touchBoost = 1));
          boostBtn.addEventListener("mouseup", () => (touchBoost = 0));

          function fromCanvas(ev) {
            const r = canvas.getBoundingClientRect();
            pointerSteer = Math.max(-1, Math.min(1, ((ev.clientX - r.left) / r.width) * 2 - 1));
            pointerGas = (ev.buttons & 1) !== 0;
            pointerBoost = (ev.buttons & 2) !== 0;
          }
          canvas.addEventListener("pointerdown", (e) => {
            if (!running) return;
            if (e.pointerType !== "mouse") return;
            mouseMode = true;
            try {
              canvas.setPointerCapture(e.pointerId);
            } catch (_) {}
            fromCanvas(e);
          });
          canvas.addEventListener("pointermove", (e) => {
            if (!mouseMode || e.pointerType !== "mouse") return;
            fromCanvas(e);
          });
          canvas.addEventListener("pointerup", () => {
            mouseMode = false;
            pointerGas = false;
            pointerSteer = 0;
            pointerBoost = false;
          });
        }

        bindInputs();
        showMenu();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
